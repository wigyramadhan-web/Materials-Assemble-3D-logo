<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logo Material Playground</title>
<style>
:root{--bg:#f4f3f0;--fg:#222;--card:#fff;--line:#d8d6d0;--acc:#3b4440;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d1c;--fg:#eee;--card:#262928;--line:#3a3d3b;--acc:#c9d2cc;--accfg:#1b1d1c}}
:root[data-theme="dark"]{--bg:#1b1d1c;--fg:#eee;--card:#262928;--line:#3a3d3b;--acc:#c9d2cc;--accfg:#1b1d1c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column}
#stage{flex:1;min-height:0}
canvas{display:block;width:100%;height:100%}
#bar{padding:12px;border-top:1px solid var(--line);background:var(--card);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.g{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.g b{font-weight:600;margin-right:2px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
input[type=color]{width:32px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
</style></head>
<body>
<div id="stage"></div>
<div id="bar">
  <div class="g" id="tgt"><b>Apply to</b></div>
  <div class="g" id="mats"><b>Material</b></div>
  <div class="g"><b>Background</b><input type="color" id="bgc" value="#e9e8e4"></div>
  <div class="g"><button id="rot">Auto-rotate</button><button id="png">Download PNG</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#e9e8e4');
const camera=new THREE.PerspectiveCamera(35,1,0.1,100);
camera.position.set(2.4,1.7,7.2);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.6,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.52;

// studio environment for reflections
const envScene=new THREE.Scene();envScene.background=new THREE.Color(0x888888);
[[0,6,0,9,.2,9,6],[-6,2,4,.2,4,6,3],[6,2,2,.2,3,5,2]].forEach(a=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(a[3],a[4],a[5]),new THREE.MeshBasicMaterial());
  m.material.color.setScalar(a[6]);m.position.set(a[0],a[1],a[2]);envScene.add(m);});
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(envScene,0.04).texture;

const key=new THREE.DirectionalLight(0xffffff,1.1);
key.position.set(-3.5,5,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-4,right:4,top:4,bottom:-4});key.shadow.bias=-0.0004;
scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:.22}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

// logo geometry (same rounded outline as the Blender model)
function rounded(pts,radii,seg=12){const out=[],n=pts.length;
  for(let i=0;i<n;i++){const p=pts[i],a=pts[(i+n-1)%n],b=pts[(i+1)%n];
    const v1=a.clone().sub(p),v2=b.clone().sub(p),l1=v1.length(),l2=v2.length();v1.normalize();v2.normalize();
    const ang=Math.acos(v1.dot(v2));let t=radii[i]/Math.tan(ang/2);t=Math.min(t,l1*.49,l2*.49);
    const r=t*Math.tan(ang/2),p1=p.clone().addScaledVector(v1,t),p2=p.clone().addScaledVector(v2,t);
    const c=p.clone().add(v1.clone().add(v2).normalize().multiplyScalar(r/Math.sin(ang/2)));
    const s=Math.atan2(p1.y-c.y,p1.x-c.x);let d=Math.atan2(p2.y-c.y,p2.x-c.x)-s;
    while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
    for(let k=0;k<=seg;k++){const th=s+d*k/seg;out.push(new THREE.Vector2(c.x+r*Math.cos(th),c.y+r*Math.sin(th)));}}
  return out;}
const px=(x,y)=>new THREE.Vector2((x-212)/100,(138-y)/100);
function piece(pts,rad){
  const g=new THREE.ExtrudeGeometry(new THREE.Shape(rounded(pts,rad)),{depth:.31,bevelEnabled:true,bevelThickness:.02,bevelSize:.02,bevelOffset:-.02,bevelSegments:4});
  g.translate(0,0,-.155);
  const m=new THREE.Mesh(g);m.castShadow=true;scene.add(m);return m;}
const L=piece([px(25,22),px(110,92),px(195,22),px(195,138),px(25,138)],[.14,.09,.14,.12,.12]);
const R=piece([px(230,138),px(314,52),px(398,138)],[.12,.16,.12]);

// procedural textures
const hs=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return hs(xi,yi)*(1-u)*(1-v)+hs(xi+1,yi)*u*(1-v)+hs(xi,yi+1)*(1-u)*v+hs(xi+1,yi+1)*u*v};
const fbm=(x,y)=>{let s=0,a=.5;for(let i=0;i<5;i++){s+=a*vn(x,y);x*=2;y*=2;a/=2}return s};
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
function tex(fn){const S=512,c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d'),im=x.createImageData(S,S);
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){const o=(j*S+i)*4,r=fn(i,j);im.data[o]=r[0];im.data[o+1]=r[1];im.data[o+2]=r[2];im.data[o+3]=255}
  x.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  t.anisotropy=8;t.repeat.set(.25,.25);t.offset.set(.5,.5);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const Std=o=>new THREE.MeshStandardMaterial(o);
const defs={
 Brand:()=>Std({color:0x3b4440,roughness:.6}),
 Timber:()=>Std({roughness:.55,map:tex((x,y)=>{const g=Math.sin((y*.07+fbm(x*.008,y*.03)*16)*Math.PI)*.5+.5;
   return mix([84,48,22],[166,108,58],g*.7+fbm(x*.05,y*.05)*.3)})}),
 Terracotta:()=>{const t=tex((x,y)=>mix([128,48,22],[184,82,44],fbm(x*.04,y*.04)));
   return Std({roughness:.85,map:t,bumpMap:t,bumpScale:.6})},
 Concrete:()=>{const t=tex((x,y)=>{let n=fbm(x*.03,y*.03)*.8+hs(x,y)*.12;if(hs(x*.37,y*.37)>.996)n*=.5;
   const v=70+n*130;return [v,v,v-3]});return Std({roughness:.92,map:t,bumpMap:t,bumpScale:.8})},
 Plastic:()=>Std({roughness:.35,map:tex((x,y)=>{const cx=Math.floor(x/16),cy=Math.floor(y/16),
   px_=cx*16+hs(cx,cy)*12+2,py=cy*16+hs(cy,cx)*12+2,d=Math.hypot(x-px_,y-py);
   if(hs(cx*3,cy*7)>.55&&d<2+hs(cx,cy*5)*2.5){const k=hs(cx*5,cy);return k>.66?[245,240,225]:k>.33?[230,150,60]:[200,60,50]}
   return [22,96,120]})}),
 Metal:()=>Std({color:0xd0d2d6,metalness:1,roughness:.3}),
 Glass:()=>new THREE.MeshPhysicalMaterial({color:0xffffff,transmission:1,roughness:.04,thickness:.35,ior:1.45})
};
const cache={};const get=n=>cache[n]||(cache[n]=defs[n]());
L.material=R.material=get('Brand');

// UI
let target='Both';
const mk=(parent,label,fn,on)=>{const b=document.createElement('button');b.textContent=label;if(on)b.className='on';
  b.onclick=()=>{parent.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn()};parent.appendChild(b)};
const tg=document.getElementById('tgt');
['Both','Left','Right'].forEach(t=>mk(tg,t,()=>target=t,t==='Both'));
const mt=document.getElementById('mats');
Object.keys(defs).forEach(n=>mk(mt,n==='Plastic'?'Recycled plastic':n==='Metal'?'Brushed metal':n,()=>{
  const m=get(n);if(target!=='Right')L.material=m;if(target!=='Left')R.material=m},n==='Brand'));
document.getElementById('bgc').oninput=e=>scene.background.set(e.target.value);
const rot=document.getElementById('rot');
rot.onclick=()=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=1.5;rot.classList.toggle('on',controls.autoRotate)};
document.getElementById('png').onclick=()=>{
  renderer.render(scene,camera);
  renderer.domElement.toBlob(async blob=>{
    const dl=window.claude&&await claude.use('downloads');
    if(dl){try{await dl.save({filename:'logo-material.png',data:blob})}catch(e){}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='logo-material.png';a.click()}
  },'image/png')};

function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',size);size();
(function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)})();
</script>
</body></html>
